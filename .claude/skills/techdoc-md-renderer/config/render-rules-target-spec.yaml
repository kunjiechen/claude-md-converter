schema_version: "2.0"
status: "target-spec"
source: "derived from current implementation, extraction report, and rule quality review"

defaults:
  document_profile: automotive_formal_spec
  page_profile: a4_cn_formal
  locale: zh-CN
  unsupported_policy: warn_and_preserve_text
  source_fix_mode: patch

document_profiles:
  automotive_formal_spec:
    description: "Formal Chinese technical specification for automotive electronics."
    structure:
      heading_numbering:
        enabled: true
        strip_source_numbering: true
      toc:
        enabled: true
        levels_html: [1, 2, 3]
        levels_word: [1, 2]
      revision_history:
        enabled: true
        required: true
      cover:
        enabled: false
    typography_profile: cn_formal
    table_profiles: [standard, register, interface, bnf, error_code]
    quality_gate: formal_delivery

  chip_register_manual:
    description: "Chip manual/register map profile."
    structure:
      heading_numbering:
        enabled: true
        strip_source_numbering: true
      toc:
        enabled: true
        levels_html: [1, 2, 3]
        levels_word: [1, 2, 3]
      revision_history:
        enabled: true
        required: false
    typography_profile: cn_formal
    table_profiles: [register, bitfield, parameter]
    quality_gate: formal_delivery

  lightweight_tech_note:
    description: "Lightweight Markdown technical note."
    structure:
      heading_numbering:
        enabled: false
      toc:
        enabled: auto
        min_headings: 4
      revision_history:
        enabled: false
    typography_profile: web_default
    table_profiles: [standard]
    quality_gate: readable_delivery

page_profiles:
  a4_cn_formal:
    size: A4
    margins:
      top: 2.5cm
      right: 2.5cm
      bottom: 2.5cm
      left: 2.5cm
    content_box:
      derive_from_page_and_margins: true
    footer:
      page_number:
        enabled: true
        position: bottom-center
        first_page: false

typography_profiles:
  cn_formal:
    fonts:
      body: ["楷体", "KaiTi", "serif"]
      heading: ["黑体", "SimHei", "sans-serif"]
      table: ["Microsoft YaHei", "微软雅黑", "sans-serif"]
      code: ["Consolas", "Courier New", "monospace"]
      math: ["Cambria Math"]
    sizes:
      body: 12pt
      h1: 22pt
      h2: 16pt
      h3: 14pt
      h4: 12pt
      table: 10pt
      code: 10pt
      footnote: 9pt
    approximate_metrics:
      # Used only when renderer/font metrics are unavailable.
      cjk_advance: 1.0em
      kana_advance: 0.92em
      latin_advance: 0.5em

  web_default:
    fonts:
      body: ["system-ui", "sans-serif"]
      heading: ["system-ui", "sans-serif"]
      table: ["system-ui", "sans-serif"]
      code: ["ui-monospace", "SFMono-Regular", "Consolas", "monospace"]
    sizes:
      body: 16px
      table: 14px
      code: 14px

markdown:
  parser: markdown-it-py
  enabled:
    table: true
    strikethrough: true
    footnote: true
    texmath: true
    deflist: true
  extensions:
    highlight:
      syntax: "==text=="
      excludes_fenced_code: true
      implementation: planned_token_rule
    pagebreak:
      syntax: "<!-- pagebreak -->"
      node: PageBreak
    table_kind_marker:
      syntax: "<!-- table: {kind} -->"
      validates_against_content: true
    prose_policy_marker:
      syntax: "<!-- prose: {policy} -->"
      policies: [compact, preserve]
  raw_html:
    block_policy: warn_and_preserve_text
    table_blocks: normalize_to_table_model
    inline_known_tags: [kbd, sub, sup, mark, del, ins, u, em, strong, code, br]
    unknown_inline_policy: preserve_text_with_warning

document_model:
  planned: true
  no_silent_content_loss: true
  block_nodes:
    - Heading
    - Paragraph
    - List
    - Table
    - CodeBlock
    - BlockQuote
    - Figure
    - Diagram
    - MathBlock
    - FootnoteDefinition
    - DefinitionList
    - PageBreak
    - RawHtmlBlock
    - UnsupportedBlock
  inline_nodes:
    - Text
    - Emphasis
    - Strong
    - Strike
    - Underline
    - Highlight
    - InlineCode
    - Link
    - Image
    - Math
    - FootnoteReference
    - Break

paragraphs:
  compacting:
    enabled_by_profile: true
    explicit_policy_overrides_heuristic: true
    classifiers:
      short_cjk:
        max_visual_chars: 42
        justification: "legacy heuristic; profile-tunable"
      short_latin:
        max_visual_chars: 90
        justification: "legacy heuristic; profile-tunable"
      note_prefix:
        prefixes: ["注意", "注", "例如", "示例", "参考", "说明", "备注"]
      clause_prefix:
        pattern: "^([（(]?[0-9一二三四五六七八九十]+[）).、]|[a-zA-Z][).、])"
    run_limits:
      min: 2
      max: 8
    diagnostics:
      emit_reason_codes: true
      low_confidence_action: review
  mixed_inline_images:
    policy: preserve
    fallback: diagnostic_placeholder

tables:
  classification:
    explicit_marker:
      enabled: true
      on_conflict: warn
    low_confidence:
      default_kind: generic
      action: review
    emit:
      confidence: true
      evidence: true
  kinds:
    register:
      headers_any: [address, addr, offset, register, reg, bits, bit, field, access, reset, description]
      content_patterns: [hex_address, bit_range, access_mode]
      min_score: 0.75
      roles:
        offset: address
        bits: bit_range
        field: field_name
        access: access
        reset: reset
        description: description
    bitfield:
      headers_any: [bits, bit, field, name, access, reset, description]
      content_patterns: [bit_range, access_mode]
      min_score: 0.75
      roles:
        bits: bit_range
        name: field_name
        access: access
        reset: reset
        description: description
    bnf:
      headers_any: [symbol, meaning, example, explanation]
      min_score: 0.70
      roles:
        symbol: symbol
        example: code_example
        meaning: description
        explanation: description
    interface:
      headers_any: [field, element_name, type, required, description, example]
      min_score: 0.70
    parameter:
      headers_any: [name, parameter, type, range, default, description]
      min_score: 0.70
    error_code:
      headers_any: [code, error, meaning, action, description]
      min_score: 0.70
    glossary:
      headers_any: [term, definition, abbreviation, description, 术语, 定义, 缩写, 描述]
      min_score: 0.65
    revision:
      headers_any: [version, date, 版次, 修订内容, 修订日期, 修订人, 备注]
      min_score: 0.80
  header_detection:
    preserve_parser_header_as_evidence: true
    produce_confidence: true
    fallback: keep_parser_header_and_review
  layout:
    strategy: role_and_content_based
    derive_content_width_from_page_profile: true
    use_font_metrics_when_available: true
    role_constraints:
      address: {font_role: code, align: center, min_width: 8mm, wrap: false}
      bit_range: {font_role: code, align: center, min_width: 10mm, wrap: false}
      access: {font_role: code, align: center, min_width: 8mm, wrap: false}
      reset: {font_role: code, align: center, min_width: 10mm, wrap: false}
      field_name: {font_role: code, align: left, min_width: 18mm, wrap: soft}
      symbol: {font_role: code, align: center, min_width: 15mm, wrap: false}
      code_example: {font_role: code, align: left, min_width: 20mm, wrap: semantic}
      description: {font_role: body, align: left, min_width: 25mm, flex: 3, wrap: true}
    overflow_policy:
      steps:
        - wrap_allowed_columns
        - apply_compact_table_font
        - switch_landscape_if_profile_allows
        - emit_overflow_review_diagnostic
    landscape:
      enabled_by_profile: true
      trigger: overflow_after_wrapping
      threshold: content_box_ratio
      ratio: 0.92

images:
  resolver:
    base_dir: source_document_dir
    data_uri: allow
    remote:
      default_policy: warn
      fetch_when: profile_allows
    missing:
      required_asset: fail
      optional_asset: review
  layout:
    block:
      max_width: content_box
      preserve_aspect_ratio: true
      align: center
      caption:
        source: alt_or_title
        enabled_by_profile: true
    inline:
      preserve_in_flow: true
      fallback: diagnostic_placeholder
  svg:
    html: preserve
    word: convert_to_png_or_warn
    pdf: backend_capability

code_blocks:
  preserve_block_identity: true
  language_required: false
  missing_language:
    severity: warning
  grammar_or_spec_style:
    default: preserve_as_code
    explicit_marker: "<!-- code: grammar -->"
    heuristic:
      enabled: true
      requires_high_confidence: true
      legacy_ratio_threshold: 0.4
      on_low_confidence: preserve_as_code
  fallback:
    missing_code_style: monospace_paragraph_style

diagrams:
  detection:
    prefer_fence_language: true
    content_fallback:
      mermaid_keywords: ["graph ", "flowchart ", "sequenceDiagram", "classDiagram", "stateDiagram", "gantt", "pie", "journey"]
      plantuml_prefixes: ["@startuml", "@startgantt"]
  mermaid:
    html:
      mode: browser
      fidelity: conformant
    paged_outputs:
      mode: prerender
      required_for_formal_delivery: true
      fallbacks: [python_flowchart, python_basic_chart, kroki, mmdc]
      raw_source_fallback:
        fidelity: non_conformant
        action: fail_or_review_by_profile
  plantuml:
    paged_outputs:
      mode: prerender
      fallbacks: [plantuml_cli, kroki]
  preflight_fixes:
    chinese_quotes: true
    chinese_colon: true
    chinese_semicolon_in_sequence: true
    chinese_parentheses: true

word:
  renderer: direct_docx_adapter
  template_resolution:
    - explicit_template
    - profile_template
    - built_in_default_template
  styles:
    create_missing: true
    semantic_map:
      body: 正文2
      note: 正文3
      compact: 紧凑正文
      subheading: 小标题
      grammar: 规范
      code: CodeBlock
      formula_text_fallback: 公式
    fallback_style: Normal
  toc:
    field_based: true
    update_required_diagnostic: warning
  lists:
    preferred: native_numbering
    fallback: manual_prefix_with_review
  tables:
    use_native_docx_tables: true
    apply_layout_plan: true
    repeat_header_rows: true
  images:
    apply_layout_plan: true
  math:
    current_support: text_fallback
    planned: omml

pdf:
  renderer: paged_output_adapter
  source:
    current: html_intermediate
    target: document_model_with_policy
  page_profile: default
  backends:
    weasyprint:
      fidelity: conformant
    chromium:
      fidelity: conformant_or_review
    wkhtmltopdf:
      fidelity: review
    libreoffice:
      fidelity: review
    reportlab_text:
      fidelity: non_conformant
      use: readable_last_resort
  sidecar:
    enabled: true
    fields: [backend, fidelity, warnings]
  fallback:
    on_backend_failure: try_next
    on_non_conformant: mark_quality_gate_review_or_fail

html:
  renderer: semantic_html_adapter
  classes_from_semantics: true
  css_from_typography_profile: true
  tables:
    overflow_wrapper: true
    horizontal_scroll: true
  diagrams:
    mermaid_browser_runtime: true
  assets:
    inline_images_when_requested: true

preflight:
  source_fix_modes: [dry_run, patch, in_place_with_backup]
  checks:
    broken_links: {severity: error, fixable_empty_href: true}
    image_refs: {missing_local: error, remote: warning}
    wide_tables: {severity: warning, rule: layout_overflow_risk}
    split_tables: {severity: warning, fixable: planned}
    unescaped_angle_placeholders: {severity: warning}
    mermaid_syntax: {severity: error_or_warning, fixable_punctuation: true}
    heading_gaps: {severity: warning}
    empty_sections: {severity: info}
    trailing_whitespace: {severity: warning, fixable: true}
    codeblock_language: {severity: warning}
    duplicate_headings: {severity: warning}
    consecutive_blank_lines: {severity: warning, fixable: true}

postflight:
  diagnostics_required: true
  checks:
    unresolved_placeholders: critical
    missing_html_images: warning
    unrendered_diagrams_in_paged_output: critical
    table_overflow_risk: warning
    pdf_too_small: critical
    degraded_backend: warning
    word_toc_needs_update: warning

quality_gates:
  formal_delivery:
    pass_requires:
      - no_content_loss
      - no_missing_required_assets
      - no_unrendered_required_diagrams
      - no_critical_postflight
    review_on:
      - low_confidence_table
      - degraded_pdf_backend
      - word_toc_needs_update
      - layout_overflow_risk
    fail_on:
      - silent_content_loss
      - missing_required_asset
      - non_conformant_pdf_for_pdf_request
      - unrendered_diagram
  readable_delivery:
    fail_on:
      - silent_content_loss
    review_on:
      - missing_optional_asset
      - degraded_backend
