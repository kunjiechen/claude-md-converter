version: "1.0"
scope: "implemented behavior of current techdoc-md-renderer"

pipeline:
  canonical_ir: "semantic HTML generated from custom dict AST"
  stages:
    - normalize_markdown_text
    - markdown_it_parse
    - token_to_ast
    - ast_semantic_analysis
    - html_render
    - export_html_word_pdf
    - postflight
    - polish
    - artifact_validation
    - quality_gate
  default_single_file_entrypoint: "ConversionPipeline.run"
  source_autofix_can_modify_markdown: true

markdown:
  parser: "markdown-it-py"
  enabled_rules:
    table: true
    strikethrough: true
  plugins:
    - footnote
    - texmath
    - deflist
  custom_preprocess:
    highlight:
      source: "==text=="
      target: "<mark>text</mark>"
      excludes_fenced_code: true
    pagebreak:
      source: "<!-- pagebreak -->"
      ast_node: "pagebreak"
    split_table_merge:
      max_blank_gap: 2
      requires_same_column_count: true
      removes_repeated_delimiter_row: true
  control_comments:
    table_kind: "<!-- table: KIND -->"
    prose_compact: "<!-- prose: compact -->"
    prose_preserve: "<!-- prose: preserve -->"
    prose_end: "<!-- /prose -->"

html:
  template_order:
    - optional_cover
    - generated_toc
    - revision_section
    - document_body
  language: "zh-CN"
  viewport: "width=device-width, initial-scale=1.0"
  default_theme: "tech-doc"
  heading_numbering:
    generated: true
    strip_manual_number_prefix: true
    skip_titles:
      - "目录"
    skip_revision_headings: true
    toc_levels: [1, 2, 3]
  css_tokens:
    font_body: ["楷体", "KaiTi", "serif"]
    font_heading: ["黑体", "SimHei", "sans-serif"]
    font_code: ["Courier New", "Consolas", "monospace"]
    font_table: ["Microsoft YaHei", "微软雅黑", "sans-serif"]
    body_size: "12pt"
    h1_size: "22pt"
    h2_size: "16pt"
    h3_size: "14pt"
    h4_size: "12pt"
    code_size: "10pt"
    table_size: "10pt"
    footnote_size: "9pt"
    page_width: "210mm"
    page_margin: "2.5cm"
  block_classes:
    paragraph: "paragraph paragraph--{prose_kind}"
    compact_group: "prose-group prose-group--compact"
    table: "table table--data table--{kind}"
    code_block: "code-block"
    image: "image"
    flowchart: "flowchart"
    pagebreak: "pagebreak"

paragraphs:
  short_cjk_limit: 42
  short_latin_limit: 90
  compact_min_run: 2
  compact_max_run: 8
  note_prefixes: ["注意", "注", "例如", "示例", "参考", "说明", "备注"]
  clause_prefix_pattern: "^([（(]?[0-9一二三四五六七八九十]+[）).、]|[a-zA-Z][).、])"
  grouping_scope: "top-level paragraphs only"
  html_rules:
    body:
      text_align: "justify"
      text_justify: "inter-ideograph"
      margin_bottom: "6pt"
    compact:
      text_align: "start"
      margin_bottom: "2pt"
      page_break_inside: "avoid"
    note:
      text_align: "start"
      margin_bottom: "3pt"

tables:
  content_width_dxa: 9000
  landscape_content_width_dxa: 13200
  explicit_marker_overrides_detection: true
  supported_kinds:
    revision:
      confidence_explicit: 1.0
      weights: [0.06, 0.40, 0.14, 0.10, 0.24, 0.06]
      center_columns: [0, 2, 3, 4]
    register:
      weights: [0.10, 0.11, 0.18, 0.09, 0.10, 0.42]
      code_columns: [0, 1, 2, 3, 4]
      center_columns: [0, 1, 3, 4]
      font_size_pt: 8.5
      landscape_rule: "col_count >= 7 and estimated_width > 0.85 * 9000"
    bitfield:
      weights: [0.12, 0.22, 0.10, 0.10, 0.46]
      code_columns: [0, 1, 2, 3]
      center_columns: [0, 1, 3, 4]
      font_size_pt: "8.5 if wide else 9 for 7+ columns"
    bnf:
      weights: [0.17, 0.22, 0.34, 0.27]
      code_columns: [0, 2]
      center_columns: [0]
    interface:
      weights: [0.24, 0.52, 0.24]
      code_columns: [1, 2]
    parameter:
      weights: [0.22, 0.14, 0.14, 0.14, 0.36]
      code_columns: [0, 1]
    error_code:
      weights: [0.14, 0.22, 0.40, 0.24]
      code_columns: [0]
    glossary:
      weights: [0.22, 0.78]
      code_columns: [0]
    reference:
      weights: [0.16, 0.26, 0.28, 0.30]
      code_columns: [0, 1]
      landscape_rule: "7-column variants may switch landscape by width estimate"
    generic:
      confidence: 0.50
      widths: "equal"
  width_adaptation:
    extra_column_weight: 0.12
    inserted_before_last_weight: true
    min_scaled_column_dxa: 500
  html_style:
    width: "100%"
    border_collapse: "collapse"
    border: "0.5px solid #808080"
    header_background: "#D9D9D9"
    padding: "4px 8px"
    vertical_align: "middle"
  word_style:
    native_docx_table: true
    fixed_layout: true
    autofit: false
    border_color: "808080"
    border_size: 4
    header_fill: "D9D9D9"
    cell_margin_dxa:
      top: 40
      bottom: 40
      left: 60
      right: 60
    repeat_header_rows: true
    zero_cell_paragraph_indent: true
    zero_cell_paragraph_spacing: true
    code_font: "Consolas"
    long_code_wrap:
      threshold_chars: 120
      target_line_chars: 48
  polish:
    min_col_dxa: 600
    padding_ratio: 1.12
    char_width_dxa:
      cjk: 240
      kana: 220
      other: 120
    header_margin_guard_dxa: 180
    two_col_max_single_ratio: 0.78
    two_col_min_edge_ratio: 0.18
    three_col_max_single_ratio: 0.68
    three_col_min_edge_ratio: 0.12
    harmonize_consecutive_same_col_tables: true

word:
  template_resolution:
    - "explicit template option"
    - "first templates/*.docx"
    - "scripts/default_template.docx"
  default_font: "宋体"
  default_font_size_pt: 12
  toc:
    inserted: true
    instruction: 'TOC \o "1-2" \h \z \u'
    update_fields_on_open: true
    pagebreak_after: true
  revision:
    always_present: true
    default_title: "文件修订履历表"
    columns: ["版次", "修订人", "修订原因", "修订内容", "修订日期", "备注"]
    pagebreak_after: true
  paragraph_styles:
    正文2: {inherits_normal: true}
    正文3: {first_line_indent_cm: 0.74}
    短正文: {space_after_pt: 3, line_spacing: 1.15}
    紧凑正文: {space_after_pt: 2, line_spacing: 1.1}
    小标题: {bold: true}
    规范: {font_name: "Consolas", font_size_pt: 10.5, first_line_indent_cm: 0.74}
    公式: {bold: true, alignment: "center"}
  lists:
    native_numbering: false
    bullets: ["●", "◆", "■", "▸"]
    ordered_pattern: "{n}、"
    task_checked: "☑"
    task_unchecked: "☐"
    left_indent_cm_base: 0.85
    left_indent_cm_per_level: 0.65
    hanging_indent_cm: -0.6
  code_blocks:
    render_as_block_container: false
    spec_ratio_threshold: 0.4
    spec_style: "规范"
    fallback_style: "正文2"
  polish:
    image_max_width_cm: 15
    remove_heading_page_break_before: true
    keep_next_heading_levels: [1, 2, 3]
    fill_missing_fonts:
      west: "Calibri"
      cjk: "Microsoft YaHei"
      mono: "Consolas"
      mono_cjk: "Microsoft YaHei"

pdf:
  source: "same full HTML as HTML exporter, plus print.css"
  page:
    size: "A4"
    margin: "2.5cm"
    footer_page_number: "bottom-center except first page"
  backend_chain:
    - weasyprint
    - chromium
    - wkhtmltopdf
    - libreoffice
    - reportlab_text
  backend_sidecar: ".pdf.backend.json"
  print_rules:
    headings_avoid_break_after: [h1, h2, h3, h4]
    cover_pagebreak_after: true
    toc_pagebreak_after: true
    revision_pagebreak_after: true
    explicit_pagebreak_hidden: true
    figures_avoid_break_inside: true
    code_blocks_avoid_break_inside: true
    table_header_repeat: true
  reportlab_text_fallback:
    preserves_layout: false
    includes_images: false
    includes_tables_as_geometry: false
    font: "STSong-Light"
    body_size_pt: 10

images:
  html:
    block_wrapper: "figure.image"
    centered: true
    max_width: "100%"
    caption: "alt text"
    inline_images_option: true
  word:
    centered: true
    dpi_fallback: 96
    initial_max_width_cm: 12
    polished_max_width_cm: 15
    caption_prefix: "图 "
    caption_size_pt: 9
    caption_color: "808080"
    missing_placeholder: "[图片: {text}]"
  risks:
    - "mixed paragraph text plus image may lose text"
    - "relative path inlining can fail because renderer input_dir is not always set"
    - "SVG support depends on target backend"

diagrams:
  detection:
    mermaid_keywords: ["graph ", "flowchart ", "sequenceDiagram", "classDiagram", "stateDiagram", "gantt", "pie", "journey"]
    plantuml_prefixes: ["@startuml", "@startgantt"]
  html_auto_mode: "browser"
  word_pdf_mode: "server"
  server_chain:
    - "python_painter for mermaid flowchart"
    - "python chart_renderers for sequence/gantt/pie"
    - "kroki if use_kroki=true"
    - "mmdc or plantuml cli"
    - "raw pre.mermaid fallback"
  python_flowchart_painter:
    node_min_width_px: 120
    node_min_height_px: 50
    node_padding_px: 20
    horizontal_spacing_px: 60
    vertical_spacing_px: 50
    max_height_px: 300
    fill_color: [255, 255, 255]
    line_color: [0, 0, 0]
    font_size_px: 14
  preflight_fixes:
    chinese_quotes: true
    chinese_colon: true
    chinese_semicolon_in_sequence: true
    chinese_parentheses: true

preflight:
  checks:
    - broken_links
    - image_refs
    - wide_tables
    - split_tables
    - unescaped_angle_placeholders
    - mermaid_syntax
    - heading_gaps
    - empty_sections
    - trailing_whitespace
    - codeblock_language
    - duplicate_headings
    - consecutive_blank_lines
  wide_table_warning_columns_gt: 6
  consecutive_blank_lines_max: 2
  codeblock_language_missing: "warning"
  heading_level_gap: "warning"
  missing_local_image: "error"

postflight:
  placeholder_patterns:
    - "\\[图片[:：]\\s*[^\\]]*\\]"
    - "\\[公式\\]"
    - "\\[数学[:：]\\s*[^\\]]*\\]"
    - "\\[table[:：]\\s*[^\\]]*\\]"
  html:
    missing_local_image: "warning"
    mermaid_without_js: "critical"
  docx:
    mermaid_raw_code: "critical"
    table_cols_gt_6_and_width_lte_9500: "warning"
    long_cell_gt_180_and_unbroken_gt_120: "warning"
    toc_maybe_unupdated: "warning"
  pdf:
    file_size_lt_bytes_critical: 1024

unsupported:
  - "arbitrary raw HTML blocks except table/control comments"
  - "true Word OMML math"
  - "MathJax/KaTeX script injection"
  - "full Mermaid grammar in Python renderer"
  - "robust SVG conversion for Word"
  - "rich nested Markdown inside pipe table cells"
  - "multi-image mixed paragraphs"
  - "native Word list numbering for regular lists"
